<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LSTSim Telemetry Viewer</title>

<script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">

<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #chart { width: 100%; height: 600px; }
  .toolbar { margin-bottom: 15px; }
</style>
</head>
<body>

<h2>LSTSim Telemetry Viewer</h2>

<div class="toolbar">
  <input type="file" id="fileInput" accept=".json">
</div>

<div id="chart"></div>

<script>
const fileInput = document.getElementById("fileInput");

function parseTime(ts) {
  const [h, m, s] = ts.split(":").map(Number);
  return (h * 3600 + m * 60 + s); // seconds since midnight, simpler & stable  
}

fileInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  const logs = JSON.parse(text);
  render(logs);
});

function render(logs) {
  //logs.sort((a, b) => parseTime(a.timestamp) - parseTime(b.timestamp));
  const xs = [];
  const mouseMove = [];
  const mouseClicks = [];
  const missions = [];
  const keypresses = [];
  const alarmEvents = [];
  
  for (const entry of logs) {
    const t = parseTime(entry.timestamp);
    alarmEvents.push(entry.type === "mission_create_and_alarm" ? 1 : null);
    keypresses.push(entry.type === "key" ? 1 : null);
    if (entry.type === "mouse") {
      xs.push(t);
      mouseMove.push(entry.moveDistance || null);
      mouseClicks.push(entry.clicks || null);
    } 
    missions.push(entry.action === "mission" ? 1 : null);
  }
  
  document.getElementById("chart").innerHTML = "";

  new uPlot({
    title: "LSTSim Telemetry Events Over Time",
    width: window.innerWidth - 50, height: 600,
    scales: { x: {time: false}, y: {auto: true}, events: {time: false}, },
    axes: [
      { label: "Time",
        values: (u, vals) => vals.map(v => {
         const h = String(Math.floor(v / 3600)).padStart(2, "0");
         const m = String(Math.floor((v % 3600) / 60)).padStart(2, "0");
         const s = String(v % 60).padStart(2, "0");
         return `${h}:${m}:${s}`; }), },
      { label: "Distance" },
      { scale: "Events", side: 1, label: "Events" }
    ],
    series: [
      {},
      { label: "Mouse Distance",
        stroke: "blue", spanGaps: true,
        points: { show: true } },
      { label: "Mouse Clicks",
        stroke: "cyan",
        fill: "rgba(0,255,255,0.3)",
        scale: "Events",
        paths: uPlot.paths.bars(), },
      { label: "Key Presses",
        stroke: "green",
        fill: "rgba(0,255,0,0.3)",
        scale: "Events",
        paths: uPlot.paths.bars(), },
      { label: "Missions",
        stroke: "orange" },
      { label: "Alarm Events",
        stroke: "red",
        fill: "rgba(255,0,0,0.7)",
        scale: "Events",
        paths: uPlot.paths.bars(),}
    ]
  },
    [ xs, mouseMove, mouseClicks, keypresses, missions, alarmEvents ], 
    document.getElementById("chart"));
}
</script>

</body>
</html>
