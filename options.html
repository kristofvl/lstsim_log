<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>LSTSIM Telemetrie Optionen</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      background: #f7faf9;
      color: #181c1c;
      max-width: 480px;
    }
    h2 { margin-top: 0; color: #00499e; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #DAE2E0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-group { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #DAE2E0;
      background: #ffffff;
      color: #181c1c;
    }
    button.primary { background: #00499e; color: #ffffff; border-color: #00499e; }
    button.danger { background: #ffdad6; color: #ba1a1a; border-color: #ba1a1a; }
    button:hover { opacity: 0.9; }
    .status-text { margin-top: 12px; font-size: 12px; color: #424753; }
  </style>
</head>
<body>
  <h2>LSTSIM Telemetrie Optionen</h2>

  <div class="form-group">
    <label for="id">Teilnehmer / Session ID</label>
    <input type="text" id="id" placeholder="z. B. 1">
  </div>

  <div class="form-group">
    <label for="username">Disponent Name</label>
    <input type="text" id="username" placeholder="z. B. Florian_112">
  </div>

  <div class="btn-group">
    <button id="btn-save" class="primary">Speichern</button>
    <button id="export-bulk">Bulk ZIP Export</button>
    <button id="export-legacy" title="Eine JSON-Datei im ursprünglichen Format, z. B. für viz.html">Legacy-Export (altes Format)</button>
    <button id="export-clear" class="danger">Export + Alles Löschen</button>
  </div>

  <p id="status" class="status-text"></p>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
